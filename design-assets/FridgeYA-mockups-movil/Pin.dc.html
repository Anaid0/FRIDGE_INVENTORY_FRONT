<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FridgeYA · PIN</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6AAB}a:hover{color:#073B5E}
.fy-key:active{background:#DCEAF5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #EEF5FB; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1E3A50; font-size: 16px; overflow: hidden">

<header style="padding: 52px 16px 0; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="Main.dc.html" style="height: 44px; padding: 0 14px 0 8px; margin-left: -8px; border-radius: 12px; display: flex; align-items: center; gap: 4px; text-decoration: none; color: #0B6AAB; font-weight: 800"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Volver</a>
<span style="font-size: 14px; font-weight: 700; color: #4F6B80">Paso 2 de 2</span>
</div>
<div aria-hidden="true" style="height: 6px; border-radius: 999px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px"><span style="border-radius: 999px; background: #FF8A1F"></span><span style="border-radius: 999px; background: #FF8A1F"></span></div>
</header>

<main style="flex-grow: 1; min-height: 0; padding: 20px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span style="width: 72px; height: 72px; border-radius: 22px; background: #0B79C3; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"></rect><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 28px; font-weight: 900; color: #073B5E">Escribe tu PIN</h1>
<p style="margin: 0; font-size: 16px; color: #4F6B80; text-wrap: pretty">Para retirar <strong style="color: #073B5E">2 Coca cola 250ml</strong> y <strong style="color: #073B5E">1 Chocorramo</strong>. Tu PIN te identifica: no hace falta elegir tu nombre.</p>
</div>
<div role="img" aria-label="{{dotsLabel}}" style="display: flex; gap: 18px; padding: 10px 0 2px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<sc-if value="{{d.filled}}" hint-placeholder-val="{{false}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: #073B5E"></span></sc-if>
<sc-if value="{{d.empty}}" hint-placeholder-val="{{true}}"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 3px solid #9DB6C9"></span></sc-if>
</sc-for>
</div>
<div style="min-height: 48px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a href="Listo.dc.html" style="height: 48px; padding: 0 22px; border-radius: 999px; background: #157A4B; color: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>PIN correcto · ver registro</a>
</sc-if>
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<span style="font-size: 14px; color: #4F6B80">Tras 5 intentos fallidos se bloquea 5 minutos.</span>
</sc-if>
</div>
</main>

<section aria-label="Teclado del PIN" style="flex-shrink: 0; padding: 0 24px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<sc-if value="{{k.isDigit}}" hint-placeholder-val="{{true}}">
<button type="button" class="fy-key" onClick="{{k.press}}" style="height: 68px; border-radius: 20px; border: 1px solid #D9E6F0; background: #FFFFFF; color: #073B5E; font-family: 'Nunito', sans-serif; font-size: 30px; font-weight: 900; cursor: pointer; box-shadow: 0 1px 0 #D9E6F0">{{k.label}}</button>
</sc-if>
<sc-if value="{{k.isBlank}}" hint-placeholder-val="{{false}}"><span></span></sc-if>
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Borrar" onClick="{{k.press}}" style="height: 68px; border-radius: 20px; border: 0; background: transparent; color: #2C4A60; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="M17 9l-6 6M11 9l6 6"></path></svg></button>
</sc-if>
</sc-for>
</section>

<footer style="flex-shrink: 0; padding: 4px 24px 34px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<button type="button" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #0B6AAB; font: inherit; font-weight: 800; cursor: pointer">Cambiar mi PIN</button>
<span style="font-size: 13px; color: #4F6B80">¿Lo olvidaste? El administrador puede restablecerlo.</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const pin = typeof st.pin === 'string' ? st.pin : '12';
const press = (v) => {
if (v === 'back') { this.setState({ pin: pin.slice(0, -1) }); return; }
if (pin.length < 4) this.setState({ pin: pin + v });
};
const labels = ['1','2','3','4','5','6','7','8','9','','0','back'];
const keys = labels.map(l => ({
label: l,
isDigit: l !== '' && l !== 'back',
isBlank: l === '',
isBack: l === 'back',
press: () => press(l)
}));
const dots = [0,1,2,3].map(i => ({ filled: i < pin.length, empty: i >= pin.length }));
return {
keys: keys, dots: dots,
done: pin.length === 4, notDone: pin.length < 4,
dotsLabel: pin.length + ' de 4 dígitos escritos'
};
}
}
</script>
</body>
</html>
